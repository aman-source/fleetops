# Mosquitto MQTT Broker Configuration
# Fleetops — IVMS device ingestion

# ── Listeners ──
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Security ──
# Allow anonymous for development. Production: set to false + use password_file/auth_plugin.
allow_anonymous true

# ── Persistence ──
persistence true
persistence_location /mosquitto/data/

# ── Logging ──
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ── Limits ──
max_inflight_messages 200
max_queued_messages 1000
message_size_limit 10240
