name: E2E Tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e/web

      - name: Start test stack
        run: pnpm test:e2e:up
        timeout-minutes: 5

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app-test on port 3100..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/health > /dev/null 2>&1; then
              echo "App is healthy"
              break
            fi
            echo "Attempt $i/30 — waiting 5s..."
            sleep 5
          done

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100
          TEST_DATABASE_URL: postgresql://fleetops:fleetops_secret@localhost:5433/fleetops_test
          TEST_MQTT_URL: mqtt://localhost:1884
          TEST_WS_URL: ws://localhost:3100
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: e2e/web/test-results/
          retention-days: 7

      - name: Tear down test stack
        if: always()
        run: pnpm test:e2e:down
